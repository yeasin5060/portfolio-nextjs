<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18002e" />
      <stop offset="50%" stop-color="#2d0052" />
      <stop offset="100%" stop-color="#0c001c" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad4)" />

  <!-- Cyberpunk Neon Glow Lines -->
  <line x1="0" y1="440" x2="800" y2="440" stroke="#a855f7" stroke-width="2" opacity="0.4" />
  <line x1="0" y1="460" x2="800" y2="460" stroke="#a855f7" stroke-width="1.5" opacity="0.25" />
  <line x1="0" y1="480" x2="800" y2="480" stroke="#a855f7" stroke-width="1" opacity="0.15" />
  <circle cx="700" cy="150" r="130" fill="#ec4899" opacity="0.1" filter="blur(50px)" />
  <circle cx="120" cy="350" r="150" fill="#8b5cf6" opacity="0.1" filter="blur(60px)" />

  <!-- Central UI Card -->
  <g transform="translate(120, 70)">
    <rect width="560" height="350" rx="24" fill="url(#cardGrad4)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))" />
    
    <!-- Top Bar -->
    <rect width="560" height="48" rx="24" fill="rgba(0,0,0,0.3)" />
    <circle cx="28" cy="24" r="5" fill="#ef4444" />
    <circle cx="44" cy="24" r="5" fill="#f59e0b" />
    <circle cx="60" cy="24" r="5" fill="#10b981" />
    <rect x="180" y="14" width="200" height="20" rx="10" fill="rgba(255,255,255,0.08)" />
    <text x="280" y="28" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">shadow-runner.game</text>

    <!-- Card Content -->
    <g transform="translate(40, 75)">
      <!-- Badge -->
      <rect x="0" y="0" width="140" height="24" rx="12" fill="rgba(168,85,247,0.25)" stroke="#a855f7" stroke-width="1" />
      <text x="70" y="16" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">CANVAS 2D GAME</text>

      <!-- Main Title -->
      <text x="0" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Shadow-Runner</text>
      <text x="0" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Interactive Endless Runner with Physics Engine</text>

      <!-- Arcade Game Screen Mockup -->
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="480" height="110" rx="16" fill="rgba(0,0,0,0.5)" stroke="rgba(168,85,247,0.3)" />

        <!-- Ground line inside game -->
        <line x1="20" y1="85" x2="460" y2="85" stroke="#a855f7" stroke-width="2" />

        <!-- Runner Silhouette / Character -->
        <circle cx="90" cy="52" r="10" fill="#c084fc" filter="drop-shadow(0 0 8px #c084fc)" />
        <rect x="85" y="62" width="10" height="18" rx="3" fill="#c084fc" />
        <line x1="86" y1="80" x2="80" y2="85" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
        <line x1="94" y1="80" x2="100" y2="85" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />

        <!-- Obstacles -->
        <polygon points="260,85 272,60 284,85" fill="#ef4444" filter="drop-shadow(0 0 6px #ef4444)" />
        <polygon points="380,85 390,52 400,85" fill="#ef4444" filter="drop-shadow(0 0 6px #ef4444)" />

        <!-- Game HUD -->
        <text x="25" y="30" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">SCORE: 04,820</text>
        <text x="360" y="30" fill="#10b981" font-family="monospace" font-size="13" font-weight="bold">FPS: 60</text>
      </g>
    </g>
  </g>
</svg>


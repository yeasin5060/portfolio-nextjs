<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad3)" />

  <!-- Ambient Light Orbs -->
  <circle cx="680" cy="80" r="150" fill="#0284c7" opacity="0.12" filter="blur(50px)" />
  <circle cx="120" cy="420" r="180" fill="#38bdf8" opacity="0.08" filter="blur(60px)" />

  <!-- Central UI Card -->
  <g transform="translate(120, 70)">
    <rect width="560" height="350" rx="24" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))" />
    
    <!-- Top Bar -->
    <rect width="560" height="48" rx="24" fill="rgba(0,0,0,0.3)" />
    <circle cx="28" cy="24" r="5" fill="#ef4444" />
    <circle cx="44" cy="24" r="5" fill="#f59e0b" />
    <circle cx="60" cy="24" r="5" fill="#10b981" />
    <rect x="180" y="14" width="200" height="20" rx="10" fill="rgba(255,255,255,0.08)" />
    <text x="280" y="28" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">erp.office-system.dev</text>

    <!-- Card Content -->
    <g transform="translate(40, 75)">
      <!-- Badge -->
      <rect x="0" y="0" width="145" height="24" rx="12" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1" />
      <text x="72" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">ENTERPRISE ERP</text>

      <!-- Main Title -->
      <text x="0" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Office ERP System</text>
      <text x="0" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Business Workflow, Attendance &amp; Resource Hub</text>

      <!-- Dashboard Grid Mockup -->
      <g transform="translate(0, 110)">
        <!-- Stat Tile 1 -->
        <rect x="0" y="0" width="145" height="110" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
        <text x="16" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">EMPLOYEES</text>
        <text x="16" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">250+</text>
        <rect x="16" y="78" width="90" height="6" rx="3" fill="#38bdf8" />

        <!-- Stat Tile 2 -->
        <rect x="165" y="0" width="145" height="110" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
        <text x="181" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ATTENDANCE</text>
        <text x="181" y="60" fill="#10b981" font-family="system-ui, sans-serif" font-size="22" font-weight="800">98.4%</text>
        <rect x="181" y="78" width="80" height="6" rx="3" fill="#10b981" />

        <!-- Stat Tile 3: Chart Graphic -->
        <rect x="330" y="0" width="145" height="110" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
        <text x="346" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">PAYROLL / TASKS</text>
        <polyline points="346,90 370,75 395,82 420,60 445,50" fill="none" stroke="#38bdf8" stroke-width="2.5" />
      </g>
    </g>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31102f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Geometric Mandala / Nakshi Pattern Accent -->
  <g opacity="0.12" stroke="#f59e0b" stroke-width="1.5" fill="none">
    <circle cx="700" cy="100" r="120" />
    <circle cx="700" cy="100" r="80" />
    <circle cx="700" cy="100" r="40" />
    <polygon points="700,20 780,100 700,180 620,100" />
    <polygon points="700,40 760,100 700,160 640,100" transform="rotate(45 700 100)" />
  </g>
  <g opacity="0.08" stroke="#ec4899" stroke-width="1.5" fill="none">
    <circle cx="100" cy="420" r="140" />
    <polygon points="100,320 200,420 100,520 0,420" />
  </g>

  <!-- Central UI Mockup Card -->
  <g transform="translate(120, 70)">
    <!-- Glass Container -->
    <rect width="560" height="350" rx="24" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))" />
    
    <!-- Top Window Bar -->
    <rect width="560" height="48" rx="24" fill="rgba(0,0,0,0.3)" />
    <circle cx="28" cy="24" r="5" fill="#ef4444" />
    <circle cx="44" cy="24" r="5" fill="#f59e0b" />
    <circle cx="60" cy="24" r="5" fill="#10b981" />
    <rect x="180" y="14" width="200" height="20" rx="10" fill="rgba(255,255,255,0.08)" />
    <text x="280" y="28" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">nokshiwala.com</text>

    <!-- Card Content -->
    <g transform="translate(40, 75)">
      <!-- Badge -->
      <rect x="0" y="0" width="130" height="24" rx="12" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="1" />
      <text x="65" y="16" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">ARTISAN CRAFTS</text>

      <!-- Main Title -->
      <text x="0" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Nokshiwala</text>
      <text x="0" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Handcrafted Lifestyle &amp; Traditional Marketplace</text>

      <!-- Mini Product Cards Mockup -->
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="145" height="110" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
        <rect x="12" y="12" width="121" height="50" rx="8" fill="rgba(245,158,11,0.2)" />
        <text x="72" y="42" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🧵</text>
        <rect x="12" y="72" width="80" height="8" rx="4" fill="#ffffff" opacity="0.8" />
        <rect x="12" y="86" width="50" height="8" rx="4" fill="#f59e0b" />

        <rect x="165" y="0" width="145" height="110" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
        <rect x="177" y="12" width="121" height="50" rx="8" fill="rgba(236,72,153,0.2)" />
        <text x="237" y="42" fill="#f472b6" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🏺</text>
        <rect x="177" y="72" width="90" height="8" rx="4" fill="#ffffff" opacity="0.8" />
        <rect x="177" y="86" width="45" height="8" rx="4" fill="#ec4899" />

        <rect x="330" y="0" width="145" height="110" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
        <rect x="342" y="12" width="121" height="50" rx="8" fill="rgba(139,92,246,0.2)" />
        <text x="402" y="42" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">✨</text>
        <rect x="342" y="72" width="70" height="8" rx="4" fill="#ffffff" opacity="0.8" />
        <rect x="342" y="86" width="55" height="8" rx="4" fill="#8b5cf6" />
      </g>
    </g>
  </g>
</svg>


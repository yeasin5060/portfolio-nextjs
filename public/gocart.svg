<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad2)" />

  <!-- Speed Lines & Ambient Orbs -->
  <circle cx="720" cy="120" r="140" fill="#10b981" opacity="0.08" filter="blur(40px)" />
  <circle cx="100" cy="400" r="160" fill="#06b6d4" opacity="0.08" filter="blur(40px)" />

  <!-- Central UI Card -->
  <g transform="translate(120, 70)">
    <rect width="560" height="350" rx="24" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))" />
    
    <!-- Top Bar -->
    <rect width="560" height="48" rx="24" fill="rgba(0,0,0,0.3)" />
    <circle cx="28" cy="24" r="5" fill="#ef4444" />
    <circle cx="44" cy="24" r="5" fill="#f59e0b" />
    <circle cx="60" cy="24" r="5" fill="#10b981" />
    <rect x="180" y="14" width="200" height="20" rx="10" fill="rgba(255,255,255,0.08)" />
    <text x="280" y="28" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">gocart-app.vercel.app</text>

    <!-- Card Content -->
    <g transform="translate(40, 75)">
      <!-- Badge -->
      <rect x="0" y="0" width="135" height="24" rx="12" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1" />
      <text x="67" y="16" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">NEXT.JS COMMERCE</text>

      <!-- Main Title -->
      <text x="0" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">GoCart</text>
      <text x="0" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">High-Performance eCommerce &amp; Cart Engine</text>

      <!-- Cart Metrics Mockup -->
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="225" height="110" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
        <text x="20" y="35" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CART CONVERSION</text>
        <text x="20" y="70" fill="#10b981" font-family="system-ui, sans-serif" font-size="28" font-weight="800">99.8%</text>
        <text x="20" y="92" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Sub-second SSR checkout</text>

        <rect x="245" y="0" width="230" height="110" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
        <text x="265" y="35" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">INSTANT DISCOVERY</text>
        <text x="265" y="70" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="28" font-weight="800">&lt; 50ms</text>
        <text x="265" y="92" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Optimized client-side indexing</text>
      </g>
    </g>
  </g>
</svg>

